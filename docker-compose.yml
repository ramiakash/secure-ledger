services:
  postgres:
    image: postgres:17-alpine
    container_name: ledger-postgres
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger_app
      POSTGRES_PASSWORD: ledger_local_pw
    ports:
      - "5433:5432"
    volumes:
      - ledger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_app -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: ledger-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ledger
      DB_USER: ledger_app
      DB_PASSWORD: ledger_local_pw
      JWT_SECRET: docker-compose-development-signing-secret-32b
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: ledger-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  ledger_pgdata: